; FamilyConnect Wandsensor – Anwesenheit (Radar oder PIR) + Helligkeit (BH1750) neben dem Wanddisplay
; Bauen und aufspielen: pio run -e c3 -t upload   (bzw. -e s3)   ·   Protokoll: pio device monitor
[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
    claws/BH1750@1.3.0

; ESP32-C3 SuperMini (klein, passt ins Gehäuse)
[env:c3]
board = esp32-c3-devkitm-1
build_flags =
    -DBOARD_C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-S3-DevKitC-1 (wie in der Musik-Box)
[env:s3]
board = esp32-s3-devkitc-1
build_flags =
    -DBOARD_S3
