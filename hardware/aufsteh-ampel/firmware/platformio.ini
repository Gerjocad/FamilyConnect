; Aufsteh-Ampel – erster Test: nur ESP32 + 8×8-Matrix (WS2812B)
; Zeigt nacheinander roten Mond, gelben Sonnenaufgang und ganze Sonne.
; Aufspielen: pio run -e s3 -t upload   (ESP32-S3-DevKitC-1)   bzw.   pio run -e c3 -t upload   (ESP32-C3 SuperMini)
[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel@1.12.3

[env:s3]
board = esp32-s3-devkitc-1
build_flags = -DBOARD_S3

[env:c3]
board = esp32-c3-devkitm-1
build_flags =
    -DBOARD_C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
