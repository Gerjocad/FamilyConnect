<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="mobile-web-app-capable" content="yes" />
<title>FamilyConnect – Wanddisplay</title>
<link rel="icon" href="icon.svg" />
<link rel="manifest" href="/wand.webmanifest" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<style>
  /* Absichtlich nur alte CSS-Technik (kein gap bei Flexbox, kein Grid, kein :has, kein color-mix):
     läuft auch im Silk-Browser alter Fire-Tablets (Fire OS 5). Look: dunkles Navy, Verlaufs-Kacheln, Ring-Anzeigen. */
  :root { --bg: #0b1026; --card: rgba(26, 34, 78, 0.78); --card2: rgba(255,255,255,0.05); --line: rgba(255,255,255,0.08);
    --text: #eef0ff; --muted: #8e96c8; --accent: #ff7a59; --warn: #ff6b8b; --pink: #ff6b8b; --violet: #b06bff; --blue: #43b4ff; --green: #46e3a5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { color: var(--text); font-family: Roboto, "Segoe UI", sans-serif; font-size: 16px; -webkit-user-select: none; user-select: none;
    background: #0b1026;
    background-image: radial-gradient(circle at 12% 0%, rgba(111, 66, 255, 0.35) 0, rgba(111, 66, 255, 0) 45%),
      radial-gradient(circle at 100% 100%, rgba(232, 64, 251, 0.22) 0, rgba(232, 64, 251, 0) 42%),
      radial-gradient(circle at 70% 10%, rgba(54, 198, 240, 0.12) 0, rgba(54, 198, 240, 0) 35%); }
  /* nachts (Lichtsensor oder 22–6 Uhr): alles gedimmt */
  .night #app { opacity: 0.5; }
  #app { display: -webkit-box; display: flex; height: 100%; padding: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0 0 8px; font-weight: 700; }

  /* --- Seitenleiste ------------------------------------------------------------------- */
  .side { width: 230px; margin-right: 12px; display: -webkit-box; display: flex; -webkit-box-orient: vertical; flex-direction: column; flex-shrink: 0; }
  .side .card { -webkit-box-flex: 1; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .clock { font-size: 62px; font-weight: 300; line-height: 1; letter-spacing: -1px; }
  .date { font-size: 17px; margin-top: 6px; }
  .family { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .people { list-style: none; margin: 14px 0 0; padding: 12px 0 0; border-top: 1px solid var(--line); -webkit-box-flex: 1; flex: 1; overflow: hidden; }
  .people li { display: flex; align-items: center; padding: 6px 8px; margin-bottom: 4px; border-radius: 12px; }
  .people li.busy { background: var(--card2); }
  .people .av { width: 34px; height: 34px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 13px; line-height: 34px; text-align: center; flex-shrink: 0; margin-right: 10px; box-shadow: 0 0 0 2px rgba(255,255,255,0.12); }
  .people .nm { -webkit-box-flex: 1; flex: 1; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .people .cnt { font-size: 12px; color: var(--muted); }
  .people .cnt b { color: var(--text); font-size: 15px; }
  .climate { padding-top: 10px; border-top: 1px solid var(--line); }
  .climate div { display: flex; justify-content: space-between; margin-top: 3px; font-size: 14px; }
  .climate .bad { color: var(--warn); font-weight: 700; }

  /* --- Hauptbereich ------------------------------------------------------------------- */
  .main { -webkit-box-flex: 1; flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .tiles { display: flex; margin-bottom: 12px; flex-shrink: 0; }
  .tile { -webkit-box-flex: 1; flex: 1; border-radius: 16px; padding: 10px 14px; color: #fff; margin-right: 12px; min-width: 0; height: 96px; overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25); }
  .tile:last-child { margin-right: 0; }
  .g1 { background: #ff6b8b; background-image: linear-gradient(135deg, #ff5f8f, #ff9a5a); }
  .g2 { background: #a64dff; background-image: linear-gradient(135deg, #7b5cff, #e040fb); }
  .g3 { background: #3a7bfd; background-image: linear-gradient(135deg, #3a6bfd, #36c6f0); }
  .t-label { font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; opacity: 0.85; }
  .t-big { font-size: 34px; font-weight: 700; line-height: 1.1; }
  .t-big small { font-size: 15px; font-weight: 600; opacity: 0.9; }
  .t-sub { font-size: 14px; opacity: 0.92; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-row { display: flex; align-items: center; }
  .t-icon { font-size: 40px; line-height: 1; margin-right: 10px; }

  /* Großes Spiel (z. B. Fenerbahçe) heute/morgen – statt der Kacheln */
  .match { display: flex; align-items: center; border-radius: 16px; padding: 10px 18px; color: #fff; margin-bottom: 12px; height: 96px; flex-shrink: 0;
    background: #ff6b8b; background-image: linear-gradient(135deg, #ff5f8f, #ff9a5a); box-shadow: 0 6px 18px rgba(0,0,0,0.3); }
  .match.tomorrow { background: var(--card); background-image: none; border: 2px solid var(--accent); }
  .m-logos { display: flex; align-items: center; flex-shrink: 0; margin-right: 16px; }
  .m-logos img { width: 70px; height: 70px; object-fit: contain; background: #fff; border-radius: 50%; padding: 6px; }
  .m-logos .vs { font-size: 22px; font-weight: 800; margin: 0 10px; }
  .m-text { min-width: 0; }
  .m-when { font-size: 15px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
  .m-when small { font-size: 13px; font-weight: 600; letter-spacing: 0; text-transform: none; opacity: 0.9; margin-left: 8px; }
  .m-title { font-size: 24px; font-weight: 700; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .m-place { font-size: 13px; opacity: 0.9; }
  .live { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #fff; margin-right: 6px; vertical-align: 1px; animation: blink 1.2s infinite; }
  @-webkit-keyframes blink { 50% { opacity: 0.2; } }
  @keyframes blink { 50% { opacity: 0.2; } }

  /* Termine heute / morgen */
  .agenda { -webkit-box-flex: 1; flex: 1; display: flex; min-height: 0; margin-bottom: 12px; }
  .day { -webkit-box-flex: 1; flex: 1; overflow: hidden; min-height: 0; min-width: 0; margin-right: 12px; }
  .day.today { -webkit-box-flex: 1.35; flex: 1.35; }
  .day:last-child { margin-right: 0; }
  .more { color: var(--muted); font-size: 13px; padding-left: 12px; }
  .special { margin-bottom: 6px; }
  .chip { display: inline-block; background: var(--card2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; margin: 0 6px 4px 0; font-size: 13px; }
  .event { display: flex; align-items: center; padding: 6px 8px 6px 10px; border-left: 4px solid var(--violet); background: var(--card2); border-radius: 4px 10px 10px 4px; margin-bottom: 6px; }
  .event.past { opacity: 0.4; }
  .event.now { background: rgba(255, 122, 89, 0.18); }
  .time { width: 62px; font-weight: 700; font-size: 16px; flex-shrink: 0; }
  .time.allday { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
  .time small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .event.cancelled { opacity: 0.5; border-left-style: dashed; }
  .event.cancelled .title .t, .event.cancelled .time { text-decoration: line-through; }
  .cancel-chip { font-size: 11px; font-weight: 700; color: #fff; background: #d6336c; border-radius: 6px; padding: 1px 6px; vertical-align: 2px; }
  .title { -webkit-box-flex: 1; flex: 1; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .title small { color: var(--muted); font-size: 13px; }
  .logo { width: 26px; height: 26px; object-fit: contain; margin-left: 8px; flex-shrink: 0; }
  .logo + .logo { margin-left: 3px; }
  .dots { margin-left: 8px; flex-shrink: 0; }
  .dot { display: inline-block; width: 22px; height: 22px; border-radius: 50%; color: #fff; font-size: 11px; font-weight: 700; line-height: 22px; text-align: center; margin-left: -4px; box-shadow: 0 0 0 2px #1a224e; }
  .empty { color: var(--muted); font-size: 15px; padding: 4px 0; }

  /* Unten: Wetterverlauf, Ringe, Pinnwand */
  .bottom { display: flex; height: 138px; flex-shrink: 0; }
  .bottom .card { margin-right: 12px; min-width: 0; overflow: hidden; }
  .bottom .card:last-child { margin-right: 0; }
  .chart { -webkit-box-flex: 1.5; flex: 1.5; }
  .bars { display: flex; align-items: flex-end; height: 64px; }
  .bar { -webkit-box-flex: 1; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; margin: 0 2px; }
  .bar i { display: block; width: 70%; max-width: 18px; border-radius: 6px 6px 3px 3px; background: #7b5cff; background-image: linear-gradient(180deg, #ff6b8b, #7b5cff); }
  .bar.rain i { background-image: linear-gradient(180deg, #36c6f0, #3a6bfd); }
  .bar b { font-size: 11px; font-weight: 700; margin-bottom: 2px; }
  .hours { display: flex; margin-top: 3px; }
  .hours span { -webkit-box-flex: 1; flex: 1; text-align: center; font-size: 10px; color: var(--muted); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rings { -webkit-box-flex: 1.2; flex: 1.2; }
  .ring-row { display: flex; justify-content: space-around; }
  .ring { text-align: center; }
  .ring svg { display: block; margin: 0 auto; }
  .ring-bg { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 7; }
  .ring-fg { fill: none; stroke-width: 7; stroke-linecap: round; }
  .ring text { fill: #fff; font-size: 14px; font-weight: 700; }
  .ring-label { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 84px; }
  .posts { -webkit-box-flex: 1; flex: 1; }
  .post { font-size: 14px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .post b { color: #ff9a5a; }

  .fullscreen-hint { position: fixed; left: 14px; bottom: 10px; font-size: 14px; font-weight: 700; color: #fff; background: #ff6b8b; border: 0; border-radius: 999px; padding: 8px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .is-fullscreen .fullscreen-hint { display: none; }
  /* Ruhemodus (Näherungssensor): schwarz mit ganz schwacher Uhr, die langsam wandert (kein Einbrennen) */
  #sleep { display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: #000; z-index: 10; }
  .sleeping #sleep { display: block; }
  #sleep div { position: absolute; color: #fff; opacity: 0.12; font-size: 56px; font-weight: 300; }
  .status { position: fixed; right: 10px; bottom: 4px; font-size: 11px; color: var(--muted); }
  /* Einrichtung */
  .setup { max-width: 460px; margin: 60px auto; text-align: center; }
  .setup h1 { font-size: 26px; margin-bottom: 6px; }
  .setup p { color: var(--muted); line-height: 1.4; }
  .setup input { font-size: 26px; letter-spacing: 3px; text-align: center; text-transform: uppercase; width: 100%; padding: 12px; border: 2px solid var(--line); border-radius: 12px; margin: 14px 0; background: var(--card); color: var(--text); }
  .setup button { font-size: 19px; font-weight: 700; color: #fff; background: #ff6b8b; border: 0; border-radius: 12px; padding: 12px 30px; }
  .error { color: var(--warn); }
  /* Hochformat: untereinander */
  @media (orientation: portrait) {
    #app { display: block; overflow: hidden; }
    .side { width: auto; margin: 0 0 12px; }
    .people { display: none; }
    .main { height: 75%; }
  }
</style>
</head>
<body>
<div id="app"></div>
<button class="fullscreen-hint" id="fullscreen" type="button">⛶ Vollbild – antippen</button>
<div class="status" id="status"></div>
<div id="sleep"><div id="sleep-clock"></div></div>
<script>
// Wanddisplay: altes JavaScript (ES5) ohne Bibliotheken, damit es auf Fire OS 5 läuft.
(function () {
  var KEY = 'familyconnect-wand-code';
  var DAYS = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
  var MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
  var app = document.getElementById('app');
  var statusEl = document.getElementById('status');
  var code = null;
  var data = null;
  var lastOk = null;
  // Näherungs-/Lichtsensor (optional): null = kein Sensor → nie schlafen, Nachtfarben 22–6 Uhr
  var sensor = null;
  var sleepAfter = 0;
  var absentSince = null;
  var awakeUntil = 0;
  var asleep = false;

  function store(name, value) {
    try { if (value === null) localStorage.removeItem(name); else localStorage.setItem(name, value); } catch (e) { /* egal */ }
  }
  function read(name) {
    try { return localStorage.getItem(name); } catch (e) { return null; }
  }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function hm(stamp) { return stamp.slice(11, 16); }
  function num(n) { return String(n).replace('.', ','); }

  function weatherIcon(c) {
    if (c === null || c === undefined) return '🌡️';
    if (c === 0) return '☀️';
    if (c <= 2) return '🌤️';
    if (c === 3) return '☁️';
    if (c <= 48) return '🌫️';
    if (c <= 67) return '🌧️';
    if (c <= 77) return '❄️';
    if (c <= 82) return '🌦️';
    if (c <= 86) return '❄️';
    return '⛈️';
  }
  function weatherLabel(c) {
    if (c === null || c === undefined) return '';
    if (c === 0) return 'Sonnig';
    if (c <= 2) return 'Leicht bewölkt';
    if (c === 3) return 'Bewölkt';
    if (c <= 48) return 'Nebel';
    if (c <= 57) return 'Nieselregen';
    if (c <= 67) return 'Regen';
    if (c <= 77) return 'Schnee';
    if (c <= 82) return 'Regenschauer';
    if (c <= 86) return 'Schneeschauer';
    return 'Gewitter';
  }

  function get(url, done) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url);
    xhr.timeout = 20000;
    xhr.onload = function () {
      var body = null;
      try { body = JSON.parse(xhr.responseText); } catch (e) { /* kein JSON */ }
      done(xhr.status, body);
    };
    xhr.onerror = xhr.ontimeout = function () { done(0, null); };
    xhr.send();
  }

  // --- Einrichtung: Code aus der App eintippen ---------------------------------------
  function showSetup(message) {
    app.innerHTML =
      '<div class="setup"><h1>📺 Wanddisplay einrichten</h1>' +
      '<p>In der FamilyConnect-App unter <b>Familie &amp; Profil → Wanddisplay</b> einen Code erstellen und hier eintippen.</p>' +
      '<form id="setup"><input id="code" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX" maxlength="20" />' +
      (message ? '<p class="error">' + esc(message) + '</p>' : '') +
      '<button>Verbinden</button></form></div>';
    document.getElementById('setup').onsubmit = function (e) {
      e.preventDefault();
      var value = document.getElementById('code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (value.length < 12) return showSetup('Der Code hat 12 Zeichen');
      get('/api/wall/' + value, function (status, body) {
        if (status === 200) {
          code = value;
          store(KEY, value);
          start(body);
        } else {
          showSetup(status === 404 ? 'Unbekannter Code – bitte prüfen' : 'Server nicht erreichbar – bitte nochmal versuchen');
        }
      });
    };
  }

  // --- Anzeige -------------------------------------------------------------------------
  function member(id) {
    for (var i = 0; i < data.members.length; i++) if (data.members[i].id === id) return data.members[i];
    return null;
  }
  function dots(ids) {
    var html = '';
    for (var i = 0; i < ids.length && i < 4; i++) {
      var m = member(ids[i]);
      if (m) html += '<span class="dot" style="background:' + esc(m.color) + '">' + esc(m.initials || m.name.charAt(0).toUpperCase()) + '</span>';
    }
    return html ? '<span class="dots">' + html + '</span>' : '';
  }
  function logos(list) {
    var html = '';
    for (var i = 0; list && i < list.length; i++) html += '<img class="logo" src="' + esc(list[i]) + '" alt="" />';
    return html;
  }
  function stampDate(stamp) {
    return new Date(Number(stamp.slice(0, 4)), Number(stamp.slice(5, 7)) - 1, Number(stamp.slice(8, 10)), Number(stamp.slice(11, 13)), Number(stamp.slice(14, 16)));
  }
  // Großes Spiel heute oder morgen (in der App beim Logo „Groß auf dem Wanddisplay“ eingeschaltet) – ersetzt die Kacheln
  function matchHtml(now, nowStamp) {
    var m = data.match;
    if (!m || m.end <= nowStamp) return '';
    var today = m.start.slice(0, 10) === nowStamp.slice(0, 10);
    var running = !m.all_day && m.start <= nowStamp;
    var when;
    if (running) {
      when = '<span class="live"></span>Läuft gerade';
    } else {
      when = (today || m.start < nowStamp ? 'Heute' : 'Morgen') + (m.all_day ? '' : ' · ' + hm(m.start) + ' Uhr');
      var minutes = Math.round((stampDate(m.start) - now) / 60000);
      if (today && !m.all_day && minutes > 0) {
        when += '<small>noch ' + (minutes >= 60 ? Math.floor(minutes / 60) + ' Std. ' : '') + (minutes % 60) + ' Min.</small>';
      }
    }
    var imgs = '';
    for (var i = 0; m.icons && i < m.icons.length && i < 2; i++) {
      if (i > 0) imgs += '<span class="vs">–</span>';
      imgs += '<img src="' + esc(m.icons[i]) + '" alt="" />';
    }
    return '<div class="match' + (today || running ? '' : ' tomorrow') + '">' +
      (imgs ? '<div class="m-logos">' + imgs + '</div>' : '') +
      '<div class="m-text"><div class="m-when">' + when + '</div>' +
      '<div class="m-title">' + esc(m.title) + '</div>' +
      (m.location ? '<div class="m-place">📍 ' + esc(m.location) + '</div>' : '') +
      '</div></div>';
  }
  function specialChips(list) {
    var icons = { birthday: '🎂', vacation: '🧳', holiday: '🎉', school: '🏖️', loan: '📚', f1: '🏁' };
    var html = '';
    for (var i = 0; i < list.length; i++) html += '<span class="chip">' + icons[list[i].kind] + ' ' + esc(list[i].text) + '</span>';
    return html ? '<div class="special">' + html + '</div>' : '';
  }
  function eventsHtml(day, isToday, nowStamp) {
    var html = specialChips(day.special);
    if (!day.events.length) return html + '<div class="empty">Keine Termine</div>';
    for (var i = 0; i < day.events.length; i++) {
      var e = day.events[i];
      var first = e.member_ids.length ? member(e.member_ids[0]) : null;
      var cls = 'event';
      if (e.cancelled) cls += ' cancelled';
      else if (isToday && !e.all_day) {
        if (e.end <= nowStamp) cls += ' past';
        else if (e.start <= nowStamp) cls += ' now';
      }
      // mehrtägige Termine: am Folgetag ab 0:00
      var time = e.all_day ? 'ganztags' : (e.start.slice(0, 10) === day.date ? hm(e.start) : 'bis ' + hm(e.end));
      var end = !e.all_day && e.start.slice(0, 10) === day.date && e.end.slice(0, 10) === day.date ? '<small>' + hm(e.end) + '</small>' : '';
      html += '<div class="' + cls + '"' + (first ? ' style="border-left-color:' + esc(first.color) + '"' : '') + '>' +
        '<span class="time' + (e.all_day ? ' allday' : '') + '">' + time + end + '</span>' +
        '<span class="title">' + (e.cancelled ? '<b class="cancel-chip">abgesagt</b> ' : '') + '<span class="t">' + esc(e.title) + '</span>' + (e.location ? ' <small>· ' + esc(e.location) + '</small>' : '') + '</span>' +
        logos(e.icons) +
        dots(e.member_ids) + '</div>';
    }
    return html;
  }

  // nicht abgesagte Termine eines Tages
  function active(day) {
    var list = [];
    for (var i = 0; day && i < day.events.length; i++) if (!day.events[i].cancelled) list.push(day.events[i]);
    return list;
  }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  // Ring-Anzeige: Anteil in Prozent, Farbe, Text in der Mitte, Beschriftung
  function ring(pct, color, text, label) {
    var r = 26, c = 2 * Math.PI * r;
    var len = Math.max(0, Math.min(100, pct)) * c / 100;
    return '<div class="ring"><svg width="64" height="64" viewBox="0 0 64 64">' +
      '<circle class="ring-bg" cx="32" cy="32" r="' + r + '" />' +
      (len > 0 ? '<circle class="ring-fg" cx="32" cy="32" r="' + r + '" stroke="' + color + '" stroke-dasharray="' + len.toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 32 32)" />' : '') +
      '<text x="32" y="37" text-anchor="middle">' + esc(text) + '</text></svg>' +
      '<div class="ring-label">' + esc(label) + '</div></div>';
  }

  function sideHtml(now, todays) {
    var html = '<div class="card"><div class="clock">' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + '</div>' +
      '<div class="date">' + DAYS[now.getDay()] + ', ' + now.getDate() + '. ' + MONTHS[now.getMonth()] + '</div>' +
      '<div class="family">' + esc(data.family) + '</div><ul class="people">';
    for (var i = 0; i < data.members.length; i++) {
      var m = data.members[i];
      var n = 0;
      for (var j = 0; j < todays.length; j++) if (todays[j].member_ids.indexOf(m.id) >= 0) n++;
      html += '<li' + (n ? ' class="busy"' : '') + '><span class="av" style="background:' + esc(m.color) + '">' + esc(m.initials || m.name.charAt(0).toUpperCase()) + '</span>' +
        '<span class="nm">' + esc(m.name.split(' ')[0]) + '</span>' +
        '<span class="cnt">' + (n ? '<b>' + n + '</b> heute' : 'frei') + '</span></li>';
    }
    html += '</ul>';
    if (data.climate.length) {
      html += '<div class="climate"><h2>Raumklima</h2>';
      for (var c = 0; c < data.climate.length; c++) {
        var s = data.climate[c];
        var tempBad = s.warnings.join(' ').indexOf('temp') >= 0;
        var humBad = s.warnings.join(' ').indexOf('humidity') >= 0;
        html += '<div><span>' + esc(s.label) + '</span><span>' +
          (s.temperature !== null ? '<span class="' + (tempBad ? 'bad' : '') + '">' + num(s.temperature) + '°</span>' : '–') +
          (s.humidity !== null ? ' · <span class="' + (humBad ? 'bad' : '') + '">' + num(s.humidity) + ' %</span>' : '') +
          '</span></div>';
      }
      html += '</div>';
    }
    return html + '</div>';
  }

  function tilesHtml(now, nowStamp, todays, tomorrows) {
    var next = null;
    for (var i = 0; i < todays.length; i++) {
      var e = todays[i];
      if (!e.all_day && e.end > nowStamp) { next = e; break; }
    }
    var sub;
    if (next) sub = (next.start <= nowStamp ? 'Jetzt: ' : 'Als Nächstes ' + hm(next.start) + ' · ') + esc(next.title);
    else if (todays.length) sub = 'Für heute alles erledigt 🎉';
    else sub = 'Ein freier Tag';
    var html = '<div class="tiles"><div class="tile g1"><div class="t-label">Heute</div>' +
      '<div class="t-big">' + todays.length + ' <small>' + (todays.length === 1 ? 'Termin' : 'Termine') + '</small></div>' +
      '<div class="t-sub">' + sub + '</div></div>';
    var first = null;
    // erster Termin mit Uhrzeit, sonst der erste ganztägige
    for (var t = 0; t < tomorrows.length; t++) if (!first || (first.all_day && !tomorrows[t].all_day)) first = tomorrows[t];
    html += '<div class="tile g2"><div class="t-label">Morgen · ' + DAYS[(now.getDay() + 1) % 7] + '</div>' +
      '<div class="t-big">' + tomorrows.length + ' <small>' + (tomorrows.length === 1 ? 'Termin' : 'Termine') + '</small></div>' +
      '<div class="t-sub">' + (first ? (first.all_day ? '' : hm(first.start) + ' · ') + esc(first.title) : 'Noch nichts geplant') + '</div></div>';
    var w = data.weather;
    if (w && w.days && w.days.length) {
      var d = w.days[0];
      var temp = w.current && w.current.temp !== null ? Math.round(w.current.temp) : d.max;
      html += '<div class="tile g3"><div class="t-label">' + esc(w.place || 'Wetter') + '</div>' +
        '<div class="t-row"><span class="t-icon">' + weatherIcon(w.current && w.current.code) + '</span>' +
        '<span style="min-width:0"><div class="t-big">' + temp + '°</div>' +
        '<div class="t-sub">' + esc(weatherLabel(w.current && w.current.code)) + ' · ' + d.max + '° / ' + d.min + '°</div></span></div></div>';
    } else {
      html += '<div class="tile g3"><div class="t-label">Pinnwand</div><div class="t-big">' + data.posts.length + '</div><div class="t-sub">' + plural(data.posts.length, 'Beitrag', 'Beiträge') + '</div></div>';
    }
    return html + '</div>';
  }

  function chartHtml() {
    var w = data.weather;
    if (!w || !w.hours || !w.hours.length) return '';
    var hours = w.hours;
    var lo = 99, hi = -99;
    for (var i = 0; i < hours.length; i++) { lo = Math.min(lo, hours[i].temp); hi = Math.max(hi, hours[i].temp); }
    var bars = '', labels = '';
    for (var j = 0; j < hours.length; j++) {
      var h = hours[j];
      var height = Math.round(8 + (hi > lo ? (h.temp - lo) / (hi - lo) : 0.5) * 38);
      bars += '<div class="bar' + (h.rain >= 50 ? ' rain' : '') + '"><b>' + Math.round(h.temp) + '°</b><i style="height:' + height + 'px"></i></div>';
      labels += '<span>' + (j % 2 === 0 ? h.time.slice(11, 13) : '') + '</span>';
    }
    var hint = w.hints && w.hints.length ? '☂ ' + w.hints[0] : (w.days[0].rain >= 30 ? '💧 Regen heute ' + w.days[0].rain + ' %' : 'Blau = Regen wahrscheinlich');
    return '<div class="card chart"><h2>Wetter nächste Stunden</h2><div class="bars">' + bars + '</div><div class="hours">' + labels + '</div>' +
      '<div class="hint">' + esc(hint) + '</div></div>';
  }

  function ringsHtml(nowStamp, todays) {
    var timed = 0, done = 0;
    for (var i = 0; i < todays.length; i++) {
      if (todays[i].all_day) continue;
      timed++;
      if (todays[i].end <= nowStamp) done++;
    }
    var html = ring(timed ? done * 100 / timed : 0, '#ff6b8b', timed ? done + '/' + timed : '–', 'Erledigt');
    var w = data.weather;
    if (w && w.days && w.days.length) html += ring(w.days[0].rain, '#43b4ff', w.days[0].rain + '%', 'Regen heute');
    var colors = ['#b06bff', '#46e3a5'];
    // höchstens drei Ringe: zuerst ein Raum mit zu hoher/niedriger Luftfeuchte, sonst der erste
    var rooms = [];
    for (var c = 0; c < data.climate.length; c++) if (data.climate[c].humidity !== null) rooms.push(data.climate[c]);
    rooms.sort(function (a, b) { return (b.warnings.join(' ').indexOf('humidity') >= 0 ? 1 : 0) - (a.warnings.join(' ').indexOf('humidity') >= 0 ? 1 : 0); });
    for (var k = 0, n = 0; k < rooms.length && n < 1; k++) {
      var s = rooms[k];
      var bad = s.warnings.join(' ').indexOf('humidity') >= 0;
      html += ring(s.humidity, bad ? '#ff6b8b' : colors[n], Math.round(s.humidity) + '%', '💧 ' + s.label);
      n++;
    }
    return '<div class="card rings"><h2>Auf einen Blick</h2><div class="ring-row">' + html + '</div></div>';
  }

  function postsHtml() {
    if (!data.posts.length) return '';
    var html = '<div class="card posts"><h2>Pinnwand</h2>';
    for (var p = 0; p < data.posts.length && p < 2; p++) {
      var author = member(data.posts[p].created_by);
      html += '<div class="post"><b>' + esc(author ? author.name.split(' ')[0] : '') + ':</b> ' + esc(data.posts[p].text) + '</div>';
    }
    return html + '</div>';
  }

  function render() {
    if (!data) return;
    var now = new Date();
    var nowStamp = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + 'T' + pad(now.getHours()) + ':' + pad(now.getMinutes());
    var hour = now.getHours();
    var night = sensor && sensor.dark !== null ? sensor.dark : hour >= 22 || hour < 6;
    document.documentElement.className = (night ? 'night' : '') + (asleep ? ' sleeping' : '');
    var todays = active(data.days[0]);
    var tomorrows = active(data.days[1]);

    var main = matchHtml(now, nowStamp) || tilesHtml(now, nowStamp, todays, tomorrows);
    main += '<div class="agenda"><div class="card day today"><h2>Heute</h2>' + eventsHtml(data.days[0], true, nowStamp) + '</div>' +
      '<div class="card day"><h2>Morgen · ' + DAYS[(now.getDay() + 1) % 7] + '</h2>' + eventsHtml(data.days[1], false, nowStamp) + '</div></div>';
    main += '<div class="bottom">' + chartHtml() + ringsHtml(nowStamp, todays) + postsHtml() + '</div>';

    app.innerHTML = '<div class="side">' + sideHtml(now, todays) + '</div><div class="main">' + main + '</div>';
    fit();
    statusEl.textContent = lastOk && now - lastOk > 15 * 60 * 1000 ? 'Keine Verbindung seit ' + pad(lastOk.getHours()) + ':' + pad(lastOk.getMinutes()) : '';
  }

  // Was nicht in eine Tageskarte passt, ausblenden und „+ N weitere“ zeigen (an der Wand scrollt niemand)
  function fit() {
    var cards = app.querySelectorAll('.day');
    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      var items = card.querySelectorAll('.event');
      var hidden = 0;
      for (var j = items.length - 1; j >= 0 && card.scrollHeight > card.clientHeight + 1; j--) {
        items[j].style.display = 'none';
        hidden++;
        var more = card.querySelector('.more');
        if (!more) {
          more = document.createElement('div');
          more.className = 'more';
          card.appendChild(more);
        }
        more.textContent = '+ ' + hidden + ' weitere';
      }
    }
  }

  // --- Ruhemodus -----------------------------------------------------------------------
  function applySensor(display) {
    var wasPresent = sensor ? sensor.present : null;
    sensor = display ? display.sensor : null;
    sleepAfter = display ? display.sleep_after : 0;
    if (!sensor || sensor.present !== false) absentSince = null;
    else if (wasPresent !== false || absentSince === null) absentSince = new Date().getTime();
    checkSleep();
    render();
  }
  function setAsleep(value) {
    if (asleep === value) return;
    asleep = value;
    // Fully Kiosk Browser kann den Bildschirm wirklich ausschalten – sonst schwarzes Bild
    try {
      if (window.fully && value && fully.turnScreenOff) fully.turnScreenOff(true);
      if (window.fully && !value && fully.turnScreenOn) fully.turnScreenOn();
    } catch (e) { /* ältere Fully-Version */ }
    if (!value) keepAwake();
    render();
    sleepClock();
  }
  function checkSleep() {
    var now = new Date().getTime();
    var shouldSleep = Boolean(sensor && sensor.present === false && sleepAfter > 0 && absentSince !== null &&
      now - absentSince >= sleepAfter * 1000 && now >= awakeUntil);
    setAsleep(shouldSleep);
  }
  function sleepClock() {
    if (!asleep) return;
    var now = new Date();
    var el = document.getElementById('sleep-clock');
    el.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
    // jede Minute an eine andere Stelle
    el.style.left = Math.round(Math.random() * Math.max(0, window.innerWidth - 170)) + 'px';
    el.style.top = Math.round(Math.random() * Math.max(0, window.innerHeight - 70)) + 'px';
  }
  // Antippen weckt auch ohne Sensor-Meldung – für die eingestellte Ruhezeit
  document.addEventListener('click', function () {
    if (!asleep) return;
    awakeUntil = new Date().getTime() + Math.max(sleepAfter, 30) * 1000;
    setAsleep(false);
  }, true);

  function load() {
    get('/api/wall/' + code, function (status, body) {
      if (status === 200) {
        data = body;
        lastOk = new Date();
        applySensor(body.display);
      } else if (status === 404) {
        store(KEY, null);
        data = null;
        showSetup('Dieses Wanddisplay wurde in der App entfernt.');
      }
      // sonst: offline – letzte Anzeige bleibt stehen
    });
  }

  var reloadTimer = null;
  function soon() {
    // mehrere Änderungen kurz hintereinander → einmal laden
    clearTimeout(reloadTimer);
    reloadTimer = setTimeout(load, 2000);
  }

  function live() {
    if (typeof EventSource !== 'function') return;
    var source = new EventSource('/api/wall/' + code + '/live');
    source.onmessage = function (e) {
      var msg = null;
      try { msg = JSON.parse(e.data); } catch (err) { /* egal */ }
      // Sensor dieses Displays: sofort umschalten, ohne alles neu zu laden
      if (msg && msg.resource === 'wall-sensor') {
        if (data && data.display && msg.display === data.display.id) applySensor(msg);
        return;
      }
      soon();
    };
    source.onerror = function () {
      // nach Verbindungsabbruch neu verbinden; EventSource versucht es selbst, bei 404 aber nicht
      if (source.readyState === 2) setTimeout(live, 30000);
    };
  }

  // Bildschirm anlassen (ab Silk 84 / Fire OS-Update); wird beim Ausblenden freigegeben und danach neu angefordert
  var wakeLock = null;
  function keepAwake() {
    if (!navigator.wakeLock || wakeLock || document.visibilityState !== 'visible') return;
    navigator.wakeLock.request('screen').then(function (lock) {
      wakeLock = lock;
      lock.addEventListener('release', function () { wakeLock = null; });
    }, function () { /* z. B. Energiesparmodus – beim nächsten Antippen nochmal */ });
  }
  document.addEventListener('visibilitychange', keepAwake);
  document.addEventListener('click', keepAwake);

  // Vollbild ohne Adressleiste: Browser erlauben das nur nach einem Antippen – jedes Tippen aufs Display reicht
  function isFullscreen() {
    return Boolean(document.fullscreenElement || document.webkitFullscreenElement)
      || (window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches);
  }
  function markFullscreen() {
    document.body.className = isFullscreen() ? 'is-fullscreen' : '';
  }
  function enterFullscreen() {
    if (isFullscreen()) return;
    var el = document.documentElement;
    var request = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!request) return;
    try {
      var result = request.call(el);
      if (result && result.then) result.then(markFullscreen, function () { /* abgelehnt – nächstes Tippen */ });
    } catch (e) { /* ältere Browser */ }
  }
  document.addEventListener('click', enterFullscreen);
  document.addEventListener('fullscreenchange', markFullscreen);
  document.addEventListener('webkitfullscreenchange', markFullscreen);
  markFullscreen();

  function pageVersion(done) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/wand?v=' + Date.now());
    xhr.onload = function () {
      if (xhr.status !== 200) return done(null);
      // kurze Prüfsumme des Seiteninhalts
      var text = xhr.responseText;
      var hash = 5381;
      for (var i = 0; i < text.length; i++) hash = ((hash * 33) ^ text.charCodeAt(i)) | 0;
      done(String(hash));
    };
    xhr.onerror = function () { done(null); };
    xhr.send();
  }

  function start(body) {
    keepAwake();
    data = body;
    lastOk = new Date();
    applySensor(body.display);
    live();
    setInterval(render, 15000); // Uhr
    setInterval(checkSleep, 5000);
    setInterval(sleepClock, 60000);
    setInterval(load, 5 * 60 * 1000); // Wetter, Raumklima, Sicherheitsnetz
    // Neue Version der Seite (nach einem Server-Update) erkennen und nur dann neu laden –
    // ein Neuladen beendet das Vollbild, das erst nach erneutem Antippen zurückkommt
    pageVersion(function (first) {
      setInterval(function () {
        pageVersion(function (now) { if (first && now && now !== first) location.reload(); });
      }, 60 * 60 * 1000);
    });
  }

  // Code aus der Adresse (wand#CODE) oder vom letzten Mal
  var fromHash = location.hash.replace('#', '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  code = fromHash || read(KEY);
  if (fromHash) {
    store(KEY, fromHash);
    history.replaceState && history.replaceState(null, '', location.pathname);
  }
  if (!code) {
    showSetup();
  } else {
    app.innerHTML = '<div class="setup"><p>Lade …</p></div>';
    get('/api/wall/' + code, function (status, body) {
      if (status === 200) start(body);
      else if (status === 404) { store(KEY, null); showSetup('Unbekannter Code – bitte neu eintippen'); }
      else { app.innerHTML = '<div class="setup"><p>Server nicht erreichbar – neuer Versuch in 30 Sekunden …</p></div>'; setTimeout(function () { location.reload(); }, 30000); }
    });
  }
})();
</script>
</body>
</html>
